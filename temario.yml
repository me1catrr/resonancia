        slug: m02-matematicas
        sesion: S2
        requiere: [J1, J2.5, J3.3, C4]
        perfil: [mse, uco]
        duracion: {lectura: 865, practica: 1115}
        duracion_temas:
          M2.1: {lectura: 105, practica: 135}
          M2.2: {lectura: 80, practica: 100}
          M2.3: {lectura: 80, practica: 100}
          M2.4: {lectura: 80, practica: 100}
          M2.5: {lectura: 105, practica: 135}
          M2.6: {lectura: 80, practica: 100}
          M2.7: {lectura: 80, practica: 100}
          M2.8: {lectura: 80, practica: 100}
          M2.9: {lectura: 80, practica: 100}
          M2.10: {lectura: 80, practica: 100}
          M2.E: {lectura: 15, practica: 45}
        python: true
        temas:
          M2.1: "Álgebra matricial: normas, condicionamiento y matrices estructuradas"
          M2.1.1: "Fundamentos de álgebra matricial: espacios, normas, condicionamiento y mínimos cuadrados"
          M2.1.2: "Matrices fundamentales: simétricas, ortogonales, proyectores y definidas positivas"
          M2.1.3: Matrices dispersas, de banda y por bloques
          M2.1.4: "Matrices de Toeplitz: autocorrelación, Yule–Walker y predicción lineal"
          M2.1.5: "Matrices de Hankel: trayectoria, SSA y realización (ERA, SSI)"
          M2.1.6: "Matrices circulantes: convolución circular y diagonalización con la DFT"
          M2.1.7: "Otras matrices con aplicación dinámica: Vandermonde, Gram, observabilidad y transición de estados"
          M2.2: Problema de valores propios estándar y generalizado
          M2.3: "Descomposición en valores singulares: interpretación, rango numérico y mínimos cuadrados"
          M2.4: Transformada de Laplace y función de transferencia
          M2.5: Series y transformada de Fourier, en continuo y en discreto
          M2.6: Representación en espacio de estados, continua y discreta
          M2.7: Transformada Z y sistemas discretos
          M2.8: "Transformada de Hilbert y señal analítica: envolvente y fase instantánea"
          M2.9: "Variables aleatorias y procesos estocásticos: estacionariedad y ergodicidad"
          M2.10: Covarianza, autocorrelación y correlación cruzada
          M2.11: "Programación aplicada: primer contacto con Julia y Claude Code"

