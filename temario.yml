# =============================================================================
# Resonancia — temario del curso (fuente de verdad)
# -----------------------------------------------------------------------------
# Este fichero define todas las unidades del curso: identificador, título,
# carpeta (slug), relación con la asignatura MSE, prerrequisitos, perfiles de
# destinatarios y temas. La estructura de la web se genera a partir de él.
#
# Convenciones:
#   - Vías M y L: cada unidad lleva `temas` con identificador propio (M3.4).
#   - `requiere`: identificadores de unidades en los que se apoya la unidad, de
#     este temario o de los sitios hermanos declarados en `externos` (J… de
#     JuliaDo, C… de ClaudeDo).
#   - `perfil`: itinerarios en los que aparece: mse (estudiante de la
#     asignatura), uco (PDI e investigación), planta (personal de planta).
#   - `python: true`: la unidad lleva pestaña Python paralela al código Julia.
#   - `duracion: {lectura: min, practica: min}`: estimación pedagógica en minutos.
#     Sin `duracion` la tabla muestra «Pendiente». `duracion_temas` (solo M2) da
#     lo mismo por apartado. Criterio: lectura = objetivos + teoría + cierre (en
#     M, palabras/150 min); práctica = práctica guiada + «Pídeselo a Claude» + ejercicios (en M,
#     4 min por ejercicio y 3–5 min por simulación; en M2 se reparte el «tiempo
#     orientativo» de cada página, 45 % lectura y 55 % práctica). No son datos
#     oficiales: se revisan con el uso real.
#   - `en_portada: true` (solo vía R): la unidad ocupa la portada de la vía.
# =============================================================================

curso:
  titulo: Resonancia
  subtitulo: Vibraciones, señales y monitorización estructural con Claude Code
  responsable: Rafael Castro Triguero
  repositorio: https://github.com/me1catrr/resonancia
  web: https://me1catrr.github.io/resonancia/
  asignatura: Monitorización de la Salud Estructural (655023) · Máster Universitario en Ingeniería Industrial · EPS Córdoba · UCO
  # Sitios hermanos: a la derecha de la barra superior.
  hermanos:
    - texto: matematicado
      href: https://me1catrr.github.io/matematicado/
    - texto: JuliaDo
      href: https://me1catrr.github.io/juliado/
    - texto: ClaudeDo
      href: https://me1catrr.github.io/claudedo/

vias:

  # ---------------------------------------------------------------------------
  - id: M
    titulo: Monitorización de la Salud Estructural
    carpeta: mse
    descripcion: Una unidad por sesión de la asignatura. Aquí vive la ciencia.
    unidades:

      - id: M0
        titulo: Introducción al SHM
        slug: m00-introduccion
        sesion: S0
        requiere: [C0]
        perfil: [mse, uco]
        duracion: {lectura: 25, practica: 40}
        temas:
          M0.1: Qué es la monitorización de la salud estructural; motivación económica y de seguridad
          M0.2: "Niveles de diagnóstico: detección, localización, cuantificación y pronóstico"
          M0.3: "El SHM como reconocimiento de patrones: adquisición, indicadores, modelo estadístico y decisión"
          M0.4: Monitorización periódica frente a continua, y estática frente a dinámica
          M0.5: "Casos de referencia: puentes, edificios, aerogeneradores, colectores solares"
          M0.6: "Cómo usar Resonancia: vías, itinerarios y unidades con Claude Code"

      - id: M1
        titulo: "Caso real I: la planta termosolar"
        slug: m01-caso-real-i
        sesion: S1
        requiere: []
        perfil: [mse, uco, planta]
        temas:
          M1.1: Funcionamiento de una central de colectores cilindro-parabólicos
          M1.2: "El colector como estructura: estructura soporte, espejos, tubo absorbedor, seguimiento y accionamiento"
          M1.3: "Acciones: viento, gravedad según la posición de seguimiento, temperatura y operación"
          M1.4: "Daños y modos de fallo: pérdida de rigidez en uniones, fatiga, deformación, desalineación óptica"
          M1.5: "Qué medir, dónde y para qué: propuesta inicial de puntos de medida"
          M1.6: Preguntas abiertas que se responderán en M12

      - id: M2
        titulo: Matemáticas, estadística y programación
        slug: m02-matematicas
        sesion: S2
        requiere: [J1, J2.5, J3.3, C4]
        perfil: [mse, uco]
        # Clase de 4 h (con 20 min de pausas, que no cuentan). El material completo
        # (11 páginas, unas 33 h) está en https://me1catrr.github.io/matematicado/
        duracion: {lectura: 90, practica: 130}
        duracion_temas:
          M2.1: {lectura: 30, practica: 40}
          M2.2: {lectura: 25, practica: 25}
          M2.3: {lectura: 25, practica: 35}
          M2.4: {lectura: 10, practica: 30}
        python: true
        temas:
          M2.1: "Modos: del modelo al problema de valores propios"
          M2.2: Polos y función de transferencia
          M2.3: "Muestreo, DFT y fuga espectral"
          M2.4: El edificio en frecuencia y mapa de matematicado

      - id: M3
        titulo: Procesamiento de señales I
        slug: m03-senales-i
        sesion: S3
        requiere: [J3.8]
        perfil: [mse, uco, planta]
        duracion: {lectura: 95, practica: 130}
        duracion_temas:
          M3.1: {lectura: 16, practica: 24}
          M3.2: {lectura: 14, practica: 16}
          M3.3: {lectura: 12, practica: 13}
          M3.4: {lectura: 13, practica: 12}
          M3.5: {lectura: 18, practica: 17}
          M3.6: {lectura: 17, practica: 18}
          M3.E: {lectura: 5, practica: 30}
        python: true
        temas:
          M3.1: "Clasificación de señales: deterministas y aleatorias, estacionarias y no estacionarias"
          M3.2: "Descriptores temporales: media, RMS, pico, factor de cresta, curtosis"
          M3.3: "Muestreo y cuantificación: resolución del convertidor y rango dinámico"
          M3.4: Teorema de Nyquist-Shannon, aliasing y filtros antialiasing
          M3.5: "DFT y FFT: resolución en frecuencia y fuga espectral"
          M3.6: "Densidad espectral de potencia: periodograma, método de Welch, escalado y unidades"

      - id: M4
        titulo: Procesamiento de señales II
        slug: m04-senales-ii
        sesion: S4
        requiere: [J3.8, J2.3]
        perfil: [mse, uco]
        duracion: {lectura: 80, practica: 145}
        duracion_temas:
          M4.1: {lectura: 15, practica: 15}
          M4.2: {lectura: 16, practica: 24}
          M4.3: {lectura: 9, practica: 16}
          M4.4: {lectura: 8, practica: 17}
          M4.5: {lectura: 6, practica: 9}
          M4.6: {lectura: 8, practica: 32}
          M4.7: {lectura: 6, practica: 14}
          M4.E: {lectura: 12, practica: 18}
        python: true
        temas:
          M4.1: "Ventanas: rectangular, Hann, Hamming y flat-top; compromiso entre resolución y fuga"
          M4.2: "Filtros FIR e IIR: diseño, respuesta en frecuencia y filtrado de fase cero"
          M4.3: "Preprocesado: offset, tendencia, remuestreo, huecos y picos espurios"
          M4.4: Integración de aceleración a velocidad y desplazamiento
          M4.5: Relación señal-ruido y ruido propio del sensor
          M4.6: Espectro cruzado, coherencia y estimadores de FRF (H1, H2)
          M4.7: "Análisis tiempo-frecuencia: espectrograma e introducción a wavelets"

      - id: M5
        titulo: Teoría de vibraciones I
        slug: m05-vibraciones-i
        sesion: S5
        requiere: [J3.6]
        perfil: [mse, uco]
        duracion: {lectura: 60, practica: 120}
        temas:
          M5.1: "Sistema de 1 GDL: ecuación del movimiento"
          M5.2: Vibración libre amortiguada y no amortiguada; decremento logarítmico
          M5.3: "Modelos de amortiguamiento: viscoso, histerético y estructural"
          M5.4: Vibración forzada armónica, resonancia y factor de amplificación
          M5.5: "FRF: receptancia, movilidad e inertancia; diagramas de Bode y Nyquist"
          M5.6: Excitación por la base, aislamiento, respuesta impulsional e integral de Duhamel

      - id: M6
        titulo: Teoría de vibraciones II y elementos finitos
        slug: m06-vibraciones-ii
        sesion: S6
        requiere: [J1.5, J3.3, J3.7]
        perfil: [mse, uco]
        duracion: {lectura: 40, practica: 60}
        temas:
          M6.1: "Sistemas de n GDL: matrices de masa, rigidez y amortiguamiento"
          M6.2: Frecuencias naturales, formas modales y normalización
          M6.3: Ortogonalidad, desacoplamiento y superposición modal
          M6.4: Amortiguamiento de Rayleigh y modos complejos
          M6.5: "Sistemas continuos: vibración de vigas"
          M6.6: "Elementos finitos: elemento viga, ensamblaje y condiciones de contorno"
          M6.7: "Actualización de modelos (model updating): parámetros, función objetivo, MAC y sensibilidades"

      - id: M7
        titulo: Identificación de sistemas dinámicos
        slug: m07-identificacion
        sesion: S7
        requiere: [J3.3, J3.7]
        perfil: [mse, uco]
        duracion: {lectura: 40, practica: 80}
        temas:
          M7.1: Análisis modal experimental (EMA) frente a operacional (OMA)
          M7.2: "Métodos de 1 GDL en frecuencia: peak-picking, circle-fit y FRF inversa"
          M7.3: Ajuste de FRF por mínimos cuadrados en sistemas de varios GDL
          M7.4: Decremento aleatorio
          M7.5: "Métodos en el dominio del tiempo: Ibrahim (ITD) y ERA"
          M7.6: Modelos ARMA
          M7.7: "Descomposición en el dominio de la frecuencia: FDD y EFDD"
          M7.8: "Identificación estocástica por subespacios: SSI-Cov y SSI-Data"
          M7.9: "Diagramas de estabilización y validación: MAC, MPC y amortiguamiento"

      - id: M8
        titulo: Tecnología de medición y adquisición
        slug: m08-adquisicion
        sesion: S8
        requiere: []
        perfil: [mse, uco]
        temas:
          M8.1: "Cadena de medida: transductor, acondicionamiento, digitalización y almacenamiento"
          M8.2: Transductores piezoeléctricos y acondicionamiento IEPE
          M8.3: "Parámetros de un acelerómetro: sensibilidad, rango, ancho de banda, ruido y sensibilidad transversal; piezoeléctricos frente a MEMS"
          M8.4: "Caso ADXL355: características y configuración"
          M8.5: Interfaz de comunicación SPI
          M8.6: Calibración de los nodos de medida
          M8.7: "Otros sensores para SHM: galgas, inclinómetros, LVDT, temperatura"
          M8.8: "Complemento: muestreo y FFT en sistemas embebidos (ESP32)"

      - id: M9
        titulo: Nodos embebidos y redes de sensores
        slug: m09-redes-sensores
        sesion: S9
        requiere: [C7]
        perfil: [mse, uco]
        temas:
          M9.1: Arquitectura de un nodo ESP32 con acelerómetro MEMS
          M9.2: "Redes inalámbricas de sensores e IoT: topologías y consumo"
          M9.3: Sincronización temporal UTC entre nodos
          M9.4: "Protocolo MQTT: broker, topics y calidad de servicio"
          M9.5: Bases de datos de series temporales
          M9.6: Dashboards en tiempo real
          M9.7: "Datos de contexto: temperatura, viento y estado operativo"

      - id: M10
        titulo: "Industria 4.0: edge computing, IoT y big data"
        slug: m10-industria-40
        sesion: S10
        provisional: true   # la guía solo da el título; confirmar contenidos
        requiere: [C8]
        perfil: [mse, uco, planta]
        temas:
          M10.1: Arquitectura borde–niebla–nube
          M10.2: "Procesamiento en el nodo: indicadores, FFT y alarmas"
          M10.3: "IoT industrial: interoperabilidad y ciberseguridad"
          M10.4: "Grandes volúmenes de datos en SHM: almacenamiento, compresión y ciclo de vida"
          M10.5: Integración con sistemas de planta (SCADA e historiadores)

      - id: M11
        titulo: Teledetección y gemelos digitales
        slug: m11-teledeteccion
        sesion: S11
        requiere: []
        perfil: [mse, uco]
        temas:
          M11.1: Fundamentos de radar de apertura sintética e interferometría (InSAR, PS, SBAS)
          M11.2: "Datos Sentinel-1: acceso y características"
          M11.3: Procesado con SNAP
          M11.4: Sistemas de información geográfica con QGIS
          M11.5: Fusión de datos de satélite y sensores in situ
          M11.6: "Gemelo digital: definición, niveles y componentes"

      - id: M12
        titulo: "Caso real II: análisis de datos"
        slug: m12-caso-real-ii
        sesion: S12
        requiere: [J2.7, J2.8, C6]
        perfil: [mse, uco]
        temas:
          M12.1: La campaña y los datos reales
          M12.2: Control de calidad de los datos
          M12.3: OMA sobre datos reales con FDD y SSI
          M12.4: Contraste con el modelo numérico de M6
          M12.5: Efectos ambientales y operacionales
          M12.6: Indicadores sensibles al daño y PCA
          M12.7: Detección de patrones con aprendizaje automático
          M12.8: El informe técnico

