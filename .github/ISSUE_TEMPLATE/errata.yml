name: He encontrado un error
description: Comunica una errata o un error en una unidad de Resonancia.
title: "[Errata] "
labels: ["errata"]
body:
  - type: input
    id: unidad
    attributes:
      label: Identificador de la unidad
      description: Identificador del tema o de la unidad donde está el error.
      placeholder: "M3.4"
    validations:
      required: true
  - type: input
    id: enlace
    attributes:
      label: Enlace a la página
      placeholder: "https://me1catrr.github.io/resonancia/mse/m03-senales-i/"
    validations:
      required: true
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción del error
      description: Qué dice la página y por qué crees que es incorrecto.
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta de corrección
      description: Opcional. Cómo crees que debería decir.
    validations:
      required: false
