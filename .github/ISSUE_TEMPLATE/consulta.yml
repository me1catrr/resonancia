name: Pregunta o sugerencia
description: Haz una pregunta sobre el curso o propón una mejora.
title: "[Consulta] "
labels: ["consulta"]
body:
  - type: input
    id: unidad
    attributes:
      label: Identificador de la unidad
      description: Opcional. Solo si tu consulta se refiere a una unidad concreta.
      placeholder: "M3.4"
    validations:
      required: false
  - type: textarea
    id: mensaje
    attributes:
      label: Tu pregunta o sugerencia
    validations:
      required: true
