project:
  type: website

# La barra superior y las barras laterales las genera
# scripts/generar_estructura.jl a partir de temario.yml. No editarlas aquí.
metadata-files:
  - _navegacion.yml

lang: es
bibliography: recursos/bibliografia.bib

# Ejercicios intercalados en el texto (véase scripts/ejercicios.lua).
filters:
  - scripts/ejercicios.lua

website:
  title: "Resonancia"
  description: "Vibraciones, señales y monitorización estructural con Claude Code"
  site-url: https://me1catrr.github.io/resonancia/
  repo-url: https://github.com/me1catrr/resonancia
  repo-actions: [edit, issue]

format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true
    code-copy: true
    # Referencias: tarjeta emergente al pasar el ratón y la entrada completa
    # junto al texto (margen). La lista completa queda al final de la unidad.
    citations-hover: true
    link-citations: true
    reference-section-title: "Referencias"

# Nombres en español de los entornos numerados (def-, thm-, prp-, exm-…).
crossref:
  fig-title: "Figura"
  tbl-title: "Tabla"
  eq-prefix: "ecuación"
  thm-title: "Teorema"
  prp-title: "Proposición"
  def-title: "Definición"
  exm-title: "Ejemplo"
  lem-title: "Lema"
  cor-title: "Corolario"
  thm-prefix: "Teorema"
  prp-prefix: "Proposición"
  def-prefix: "Definición"
  exm-prefix: "Ejemplo"
  lem-prefix: "Lema"
  cor-prefix: "Corolario"

execute:
  freeze: auto
